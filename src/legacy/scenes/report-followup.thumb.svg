<svg class="sv" viewBox="0 0 320 226" role="img" aria-label="A three-step timeline. During the drive a driver makes a report or an update request. After parking, Proposed shows a call from Waze’s AI assistant with answer chips. In the map editor, the map issue gains the direction and end time.">
<rect class="sv-map" width="320" height="226"/>
<line class="sv-conn" x1="22" y1="36" x2="22" y2="190"/>
<circle class="rf-step" cx="22" cy="36" r="9"/><text class="rf-stept" x="22" y="39.5" text-anchor="middle">1</text>
<circle class="rf-step" cx="22" cy="110" r="9"/><text class="rf-stept" x="22" y="113.5" text-anchor="middle">2</text>
<circle class="rf-step" cx="22" cy="190" r="9"/><text class="rf-stept" x="22" y="193.5" text-anchor="middle">3</text>
<text class="sv-lbl" x="40" y="14">DURING THE DRIVE</text>
<path class="sv-road" stroke-width="12" d="M40 38 L312 38"/>
<path class="sv-mark" d="M40 38 L312 38"/>
<g class="sv-you" transform="translate(70 34) rotate(90) scale(0.75)" data-s="0.75"><rect class="bd" x="-5.5" y="-9.5" width="11" height="19" rx="3.2"/><rect class="ws" x="-4.2" y="-5.6" width="8.4" height="4.4" rx="1.2"/><rect class="ws" x="-3.8" y="5" width="7.6" height="2.4" rx="1"/></g>
<g transform="translate(206 38)"><rect class="sv-hot" x="-10" y="-5.5" width="20" height="11" rx="1.5"/><rect class="sv-wh" x="-5.5" y="-5.5" width="3" height="11"/><rect class="sv-wh" x="2.5" y="-5.5" width="3" height="11"/></g>
<rect class="sv-hud" x="40" y="52" width="272" height="18" rx="9"/>
<text class="sv-t2b" x="50" y="64.3">REPORT OR UPDATE REQUEST · UHURU HWY</text>
<text class="sv-lbl" x="40" y="86">AFTER PARKING</text>
<g class="sv-t">
<rect class="sv-nohud" x="40" y="94" width="272" height="40" rx="9"/>
<text class="sv-lbl" x="52" y="118">NO FOLLOW-UP</text>
</g>
<g class="sv-p">
<rect class="sv-hud" x="40" y="92" width="272" height="66" rx="10" data-focus/>
<text class="sv-t2b" x="52" y="106">WAZE AI ASSISTANT · VOICE CALL</text>
<text class="sv-t1" x="52" y="121">You reported a closure on Uhuru Highway.</text>
<text class="sv-t2" x="52" y="134">Which direction, and until when?</text>
<rect class="rf-chip" x="52" y="139" width="56" height="14" rx="7"/><text class="rf-chipt" x="80" y="149" text-anchor="middle">Northbound</text>
<rect class="rf-chip on" x="112" y="139" width="56" height="14" rx="7"/><text class="rf-chipt on" x="140" y="149" text-anchor="middle">Southbound</text>
<rect class="rf-chip on" x="176" y="139" width="40" height="14" rx="7"/><text class="rf-chipt on" x="196" y="149" text-anchor="middle">18:00</text>
<rect class="rf-chip" x="220" y="139" width="46" height="14" rx="7"/><text class="rf-chipt" x="243" y="149" text-anchor="middle">Not sure</text>
</g>
<text class="sv-lbl" x="40" y="172">IN THE MAP EDITOR</text>
<rect class="sv-panel" x="40" y="178" width="272" height="42" rx="9"/>
<text class="rf-head" x="52" y="194">Map issue · Closure, Uhuru Highway</text>
<g class="sv-verdict sv-t on-surface"><path class="vd-x" d="M50.0 202.8 l6 6 m0 -6 l-6 6"/><text class="sv-note" x="60.0" y="210.0">Direction? Until when? No reply</text></g>
<g class="sv-verdict sv-p on-surface" style="--d:1"><path class="vd-ok" d="M50.0 206.2 l2.4 2.6 l4.6 -6.2"/><text class="sv-okn" x="60.0" y="210.0">Southbound · until 18:00</text></g>
<text class="sv-ill" x="312" y="14" text-anchor="end">ILLUSTRATION</text>
</svg>
